[project]
name = "enhanced-mlops"
version = "1.0.0"
description = "Enhanced MLOps project with FastAPI, MLflow, and containerization"
readme = "README.md"
authors = [
    {name = "MLOps Engineer", email = "engineer@mlops.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "scikit-learn==1.3.2",
    "mlflow==2.8.1",
    "joblib==1.3.2",
    "numpy==1.24.3",
    "pandas==2.1.4",
    "pydantic==2.5.0",
    "python-multipart==0.0.6",
    "prometheus-client==0.19.0",
    "requests==2.31.0",
    "pytest==7.4.3",
    "httpx==0.25.2",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]